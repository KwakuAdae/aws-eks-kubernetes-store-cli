server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Liveness and readiness probes call this
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Which pod and version answered? Used by the test scripts.
    location = /info.json {
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    location / {
        index index.html;
        add_header Cache-Control "no-store";
    }
}
