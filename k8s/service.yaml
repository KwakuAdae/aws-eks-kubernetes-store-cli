# One stable public address for all the pods: EKS Auto Mode creates an AWS Network Load Balancer.
apiVersion: v1
kind: Service
metadata:
  name: kwaku-store
  namespace: kwaku-store
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer
  loadBalancerClass: eks.amazonaws.com/nlb
  selector:
    app: kwaku-store
  ports:
    - name: http
      port: 80
      targetPort: 80
