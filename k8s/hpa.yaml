# Horizontal Pod Autoscaler: add pods when average CPU passes 50% of the requested CPU,
# remove them when traffic drops (between 3 and 10 pods).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kwaku-store
  namespace: kwaku-store
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kwaku-store
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120    # wait 2 minutes of low load before removing pods
